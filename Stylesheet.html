<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    color: #202124;
    background: #f8f9fa;
    min-height: 100vh;
}

/* ── Header ── */
header {
    background: #fff;
    border-bottom: 1px solid #dadce0;
    padding: 0 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
}

header svg { flex-shrink: 0; }

header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #202124;
}

/* ── Tabs ── */
.tabs {
    display: flex;
    gap: 0;
    margin-left: auto;
}

.tab {
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 500;
    color: #5f6368;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    user-select: none;
}

.tab:hover { color: #1a73e8; }
.tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }

/* ── Main layout ── */
main {
    margin: 32px auto;
    padding: 0 24px;
}

.panel { display: none; }
.panel.active { display: block; }

/* ── Card ── */
.card {
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 20px;
}

.card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
}

.card-hint {
    color: #5f6368;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 16px;
}

.card-hint code {
    background: #f1f3f4;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 12px;
    font-family: 'Roboto Mono', monospace;
}

/* ── Textarea ── */
textarea {
    width: 100%;
    min-height: 245px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    padding: 12px 14px;
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.7;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
    color: #202124;
}
textarea:focus { border-color: #1a73e8; }

.validation-msg {
    font-size: 12px;
    color: #d93025;
    min-height: 18px;
    margin-top: 6px;
}

/* ── Actions ── */
.actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
}

button {
    padding: 9px 22px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: background 0.15s, opacity 0.15s;
}
button:disabled { opacity: 0.45; cursor: default; }

.btn-primary { background: #1a73e8; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #1557b0; }

.btn-ghost { background: transparent; color: #1a73e8; padding: 9px 12px; }
.btn-ghost:hover:not(:disabled) { background: #f1f3f4; }

/* ── Spinner ── */
.spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid #dadce0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
}
.spinner.visible { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Results log ── */
.log {
    margin-top: 16px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    overflow: hidden;
    display: none;
}
.log.visible { display: block; }

.log-header {
    font-size: 11px;
    font-weight: 600;
    color: #5f6368;
    padding: 7px 14px;
    background: #f8f9fa;
    border-bottom: 1px solid #dadce0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.log-body { max-height: 220px; overflow-y: auto; }

.log-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 14px;
    border-bottom: 1px solid #f1f3f4;
    font-size: 13px;
}
.log-row:last-child { border-bottom: none; }

.badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.badge-created { background: #e6f4ea; color: #137333; }
.badge-skipped { background: #fef7e0; color: #b06000; }
.badge-error   { background: #fce8e6; color: #c5221f; }

.log-email  { font-family: monospace; color: #3c4043; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-detail { color: #80868b; font-size: 12px; white-space: nowrap; }

/* ── Filters table ── */
.table-wrap {
    overflow-x: auto;
    border-radius: 6px;
    border: 1px solid #dadce0;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

thead tr { background: #f8f9fa; }

th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 700;
    color: #5f6368;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid #dadce0;
    white-space: nowrap;
}

td {
    padding: 10px 14px;
    border-bottom: 1px solid #f1f3f4;
    color: #3c4043;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8f9fa; }

td.email { font-family: monospace; font-size: 12px; }

.pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
}
.pill-yes { background: #e6f4ea; color: #137333; }
.pill-no  { background: #f1f3f4; color: #80868b; }

.empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #80868b;
    font-size: 13px;
}

.loading-state {
    text-align: center;
    padding: 32px;
    color: #80868b;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.loading-state .spinner { display: inline-block; }

/* ── Table of Action and Criteria keys ── */

.scroll-panel {
    height: 516.6px;
    width: 100%;
    border: 1px solid #ccc;
    overflow: scroll;
}

.scroll-panel table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
}

.scroll-panel th, .scroll-panel td {
    border: 1px solid #ccc;
    padding: 8px;
}

.scroll-panel code {
    background: #f1f3f4;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 12px;
    font-family: 'Roboto Mono', monospace; 
}

.scroll-panel th {
    background-color: #f8f9fa;
    font-weight: 600;
    text-align: center;
}
</style>
